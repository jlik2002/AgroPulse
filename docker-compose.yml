# Основная точка запуска проекта: docker compose up --build
#
# Порядок подъёма задан через healthcheck и condition, поэтому отдельных
# скриптов ожидания не требуется. Миграции выполняет отдельный сервис `migrate`,
# а не старт приложения: иначе при нескольких репликах api они пойдут наперегонки.

name: agropulse

x-backend-env: &backend-env
  env_file:
    - .env
  environment:
    PYTHONPATH: /app/backend

x-backend-build: &backend-build
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      # Локальный образ несёт pytest и ruff, чтобы прогон тестов не требовал
      # отдельной сборки: docker compose run --rm api pytest
      INSTALL_DEV: "true"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agropulse}
      POSTGRES_USER: ${POSTGRES_USER:-agropulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agropulse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agropulse} -d ${POSTGRES_DB:-agropulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agropulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-agropulse123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый сервис: накатывает миграции и завершается.
  # Исходники монтируются, чтобы новая миграция применялась без пересборки образа.
  # В Kubernetes тот же шаг выполняет Job из собранного образа, без монтирования.
  migrate:
    <<: [*backend-build, *backend-env]
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: [*backend-build, *backend-env]
    command: ["uvicorn", "agropulse.main:create_app", "--factory",
              "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app/backend        # автоперезагрузка при правках кода
      - ./scripts:/app/scripts        # служебные скрипты проверки
      - ./data:/app/data              # вход и выход batch-инференса
      - ./secrets:/run/secrets:ro     # ключ сервис-аккаунта GEE
      # Настройки pytest и ruff живут здесь: правка не должна требовать пересборки.
      - ./pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Медленные задачи: обращения к GEE, STAC, Open-Meteo. Упираются в сеть.
  worker-collect:
    <<: [*backend-build, *backend-env]
    command: ["celery", "-A", "agropulse.tasks.celery_app.celery_app", "worker",
              "--queues", "collect", "--concurrency", "4", "--loglevel", "info"]
    volumes:
      - ./backend:/app/backend
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Сбор по одному полю занимает минуты — даём задаче доработать при остановке.
    stop_grace_period: 300s

  # Быстрые задачи: климатология, аномалии, риск, отчёты. Упираются в CPU.
  worker-analyze:
    <<: [*backend-build, *backend-env]
    command: ["celery", "-A", "agropulse.tasks.celery_app.celery_app", "worker",
              "--queues", "analyze", "--concurrency", "2", "--loglevel", "info"]
    volumes:
      - ./backend:/app/backend
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  # SPA за nginx. Тот же образ уезжает в Kubernetes: адрес API нигде
  # не зашит в сборку — путь /api проксирует сам nginx.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  # MTU сети контейнеров занижен намеренно. Трафик наружу может уходить через
  # туннель с MTU 1420, а форвардинг из docker-сети не подрезает MSS. При MTU
  # 1500 это проявляется характерно: TCP-соединение устанавливается, а TLS-
  # хендшейк виснет, потому что крупный пакет с сертификатом сервера не проходит.
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

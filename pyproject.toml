[project]
name = "agropulse"
version = "0.1.0"
description = "AgroPulse — сервис дистанционного мониторинга сельскохозяйственных полей"
requires-python = ">=3.12"

dependencies = [
    # --- веб-слой ---
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "sse-starlette~=2.1.3",          # SSE-поток прогресса стадий пайплайна

    # --- база данных ---
    "SQLAlchemy~=2.0.36",
    "alembic~=1.14.0",
    "psycopg[binary]~=3.2.3",
    "GeoAlchemy2~=0.15.2",           # тип Geometry для полигонов полей

    # --- очередь задач ---
    "celery[redis]~=5.4.0",
    "redis~=5.2.0",                  # тот же клиент используется для кэша и pub/sub

    # --- геометрия и данные ---
    "shapely~=2.0.6",
    "pyproj~=3.7.0",
    "numpy~=2.1.0",
    "pandas~=2.2.3",
    "scipy~=1.14.1",
    "statsmodels~=0.14.4",           # LOWESS-базлайн ожидаемой кривой сезона
    "ruptures~=1.1.9",               # PELT — поиск структурных переломов ряда NDVI

    # --- модель восстановления пропусков (V6) ---
    "catboost~=1.2.10",              # сама модель; обучение в сервисе не запускается
    "scikit-learn~=1.5",             # Ridge в межполевых признаках V6

    # --- внешние источники ---
    "earthengine-api~=1.1.2",        # основной источник Sentinel-2
    "rasterio~=1.4.1",               # чтение COG для резервного источника STAC
    "httpx~=0.27.2",                 # STAC, Open-Meteo, Overpass, Nominatim, ML-сервис

    # --- отчёты ---
    "Jinja2~=3.1.4",                 # шаблоны PDF-отчётов
    "WeasyPrint~=63.0",              # рендер HTML в PDF
    "matplotlib~=3.9.2",             # графики для отчётов

    # --- хранилище артефактов ---
    "boto3~=1.35.0",                 # MinIO / S3-совместимое хранилище
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.3",
    "pytest-cov~=6.0.0",
    "ruff~=0.7.4",
]

[project.scripts]
agropulse = "agropulse.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["agropulse*"]

[tool.setuptools.package-data]
# Обученная модель V6 лежит рядом с кодом и обязана попадать в пакет:
# без неё восстановление пропусков не работает, а обучать в сервисе нечем.
"agropulse.ml.v6" = ["artifacts/*.cbm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Начальная миграция сгенерирована Alembic. Переносить в ней строки вручную
# бессмысленно: следующий autogenerate вернёт исходное форматирование.
"**/migrations/versions/c9bd6d23f610_initial_schema.py" = ["E501"]
# Код модели V6 перенесён из архива экспериментов и намеренно не приводится
# к стилю проекта: любое расхождение с архивом делает результат
# невоспроизводимым. Подробности — backend/agropulse/ml/v6/README.md.
"backend/agropulse/ml/v6/ndvi_v3.py" = ["ALL"]
"backend/agropulse/ml/v6/ndvi_v5.py" = ["ALL"]
"backend/agropulse/ml/v6/scene_features.py" = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
# Строгий режим: опечатка в имени маркера должна быть ошибкой, а не
# молча пропущенным тестом. Предупреждения тоже видны, а не спрятаны.
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]

[project]
name = "agropulse"
version = "0.1.0"
description = "AgroPulse — сервис дистанционного мониторинга сельскохозяйственных полей"
requires-python = ">=3.12"

dependencies = [
    # --- веб-слой ---
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "sse-starlette~=2.1.3",          # SSE-поток прогресса стадий пайплайна

    # --- база данных ---
    "SQLAlchemy~=2.0.36",
    "alembic~=1.14.0",
    "psycopg[binary]~=3.2.3",
    "GeoAlchemy2~=0.15.2",           # тип Geometry для полигонов полей

    # --- очередь задач ---
    "celery[redis]~=5.4.0",
    "redis~=5.2.0",                  # тот же клиент используется для кэша и pub/sub

    # --- геометрия и данные ---
    "shapely~=2.0.6",
    "pyproj~=3.7.0",
    "numpy~=2.1.0",
    "pandas~=2.2.3",
    "scipy~=1.14.1",

    # --- внешние источники ---
    "earthengine-api~=1.1.2",        # основной источник Sentinel-2
    "httpx~=0.27.2",                 # Open-Meteo, Overpass, Nominatim, ML-сервис

    # --- хранилище артефактов ---
    "boto3~=1.35.0",                 # MinIO / S3-совместимое хранилище
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.3",
    "pytest-cov~=6.0.0",
    "ruff~=0.7.4",
]

[project.scripts]
agropulse = "agropulse.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["agropulse*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

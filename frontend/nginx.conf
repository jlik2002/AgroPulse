# Раздача SPA и проксирование API на бэкенд.
#
# Адрес бэкенда берётся из переменной окружения через resolver, а не зашит
# в конфиг: тот же образ работает и в compose, и в Kubernetes, где имя
# сервиса другое.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Проба для healthcheck: отвечает без обращения к бэкенду.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Хэш в имени файла делает содержимое неизменяемым — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поток прогресса (SSE) не должен буферизоваться и обрываться
        # по таймауту: сбор данных по полю занимает минуты.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрут разбирает роутер.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

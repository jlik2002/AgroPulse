# Надстройка над docker-compose.yml для сервера.
#
# Применяется вместе с базовым файлом:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Делает две вещи. Первая — порты инфраструктуры не публикуются на хост
# вовсе, а api и web слушают только 127.0.0.1: наружу смотрит единственный
# процесс, host-nginx с basic-аутентификацией. Без этого postgres, redis и
# консоль MinIO торчали бы в интернет напрямую, в обход всякой авторизации,
# и вдобавок дрались бы за порты с тем, что уже стоит на сервере. Достучаться
# до них при разборе можно через `docker compose exec` или туннель по ssh.
# Вторая — uvicorn поднимается без --reload:
# сторож файловой системы на сервере только держит память и роняет процесс
# при правке кода на горячую.

services:
  postgres:
    ports: []

  redis:
    ports: []

  minio:
    ports: []

  api:
    command: ["uvicorn", "agropulse.main:create_app", "--factory",
              "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  worker-collect:
    restart: unless-stopped

  worker-analyze:
    restart: unless-stopped

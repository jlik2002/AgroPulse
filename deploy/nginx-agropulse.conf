# Внешний вход в сервис: host-nginx на 80 порту.
#
# Единственный порт, открытый наружу. Закрыт basic-аутентификацией,
# дальше отдаёт всё в контейнер web (тот сам разводит статику SPA и /api).
# Файл кладётся в /etc/nginx/sites-available/agropulse и линкуется
# в sites-enabled; дефолтный сайт nginx при этом отключается.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    auth_basic "AgroPulse";
    auth_basic_user_file /etc/nginx/.htpasswd-agropulse;

    # Контуры полей и выгрузки бывают крупными: дефолтного 1 МБ мало.
    client_max_body_size 64m;

    access_log /var/log/nginx/agropulse.access.log;
    error_log  /var/log/nginx/agropulse.error.log;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поток прогресса обработки (SSE) идёт минутами и не должен
        # ни буферизоваться, ни обрываться по таймауту. Те же значения
        # стоят во внутреннем nginx контейнера web.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
